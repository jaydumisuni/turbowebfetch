name: codeops-live-provider-coding-trial

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: codeops-live-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeops-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout clean mission branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository, CodeOps, and Sergeant
        run: |
          npm ci --ignore-scripts
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps --no-build-isolation 'git+https://github.com/jaydumisuni/hunter-codeops.git@main'
          python -m pip install --no-deps --no-build-isolation 'git+https://github.com/jaydumisuni/Sergeant.git@main'
      - name: Cool down the hosted coding route
        run: sleep 75
      - name: Let CodeOps author, correct, and prove every stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIAL_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/codeops_staged_trial_entry.py 2>&1 | tee codeops-live-trial.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Run independent Sergeant review on generated product code
        run: |
          sergeant pr-review "$GITHUB_WORKSPACE" \
            --file-list codeops-live-changed-files.txt \
            --pretty > sergeant-live-provider-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('sergeant-live-provider-review.json').read_text(encoding='utf-8'))
          verdict = packet.get('verdict', {})
          summary = {
              'verdict': verdict.get('verdict'),
              'confidence': verdict.get('confidence'),
              'reason': verdict.get('reason'),
              'required_actions': verdict.get('required_actions', []),
              'officer_verdict': packet.get('officer_council', {}).get('verdict'),
              'cpl_status': packet.get('cpl_review', {}).get('status'),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if verdict.get('verdict') != 'APPROVE' or verdict.get('required_actions'):
              raise SystemExit('Sergeant did not approve the CodeOps-authored implementation')
          PY
      - name: Prepare guaranteed evidence bundle
        if: always()
        run: |
          mkdir -p trial-artifact
          for file in \
            codeops-live-trial-evidence.json \
            codeops-live-trial.log \
            codeops-live-generated.patch \
            codeops-live-changed-files.txt \
            sergeant-live-provider-review.json; do
            if [ -f "$file" ]; then cp "$file" trial-artifact/; fi
          done
          if [ -d codeops-staged-evidence ]; then
            cp -R codeops-staged-evidence trial-artifact/
          fi
          if [ -f codeops-live-trial.log ]; then
            tail -n 300 codeops-live-trial.log > trial-artifact/failure-tail.log
          else
            printf '%s\n' 'CodeOps trial log was not created.' > trial-artifact/failure-tail.log
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('codeops-live-trial-evidence.json')
          summary = {'status': 'evidence_file_missing'}
          if source.is_file():
              packet = json.loads(source.read_text(encoding='utf-8'))
              summary = {
                  'status': packet.get('status'),
                  'classification': packet.get('classification'),
                  'failed_stage': next(
                      (stage.get('stage') for stage in packet.get('stages', []) if stage.get('status') == 'failed'),
                      None,
                  ),
                  'error': packet.get('error'),
                  'stage_count': len(packet.get('stages', [])),
              }
          Path('trial-artifact/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          find trial-artifact -maxdepth 4 -type f -print | sort
      - name: Upload complete live-provider coding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeops-live-provider-coding-trial
          path: trial-artifact/
          if-no-files-found: error
          retention-days: 30
