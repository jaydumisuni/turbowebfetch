name: codeops-live-provider-coding-trial

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  codeops-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout clean mission branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository, CodeOps, and Sergeant
        run: |
          npm ci --ignore-scripts
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps --no-build-isolation 'git+https://github.com/jaydumisuni/hunter-codeops.git@main'
          python -m pip install --no-deps --no-build-isolation 'git+https://github.com/jaydumisuni/Sergeant.git@main'
      - name: Let CodeOps author, correct, and prove every stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIAL_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/codeops_staged_trial.py 2>&1 | tee codeops-live-trial.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Run independent Sergeant review on generated product code
        run: |
          sergeant pr-review "$GITHUB_WORKSPACE" \
            --file-list codeops-live-changed-files.txt \
            --pretty > sergeant-live-provider-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('sergeant-live-provider-review.json').read_text(encoding='utf-8'))
          verdict = packet.get('verdict', {})
          summary = {
              'verdict': verdict.get('verdict'),
              'confidence': verdict.get('confidence'),
              'reason': verdict.get('reason'),
              'required_actions': verdict.get('required_actions', []),
              'officer_verdict': packet.get('officer_council', {}).get('verdict'),
              'cpl_status': packet.get('cpl_review', {}).get('status'),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if verdict.get('verdict') != 'APPROVE' or verdict.get('required_actions'):
              raise SystemExit('Sergeant did not approve the CodeOps-authored implementation')
          PY
      - name: Upload complete live-provider coding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeops-live-provider-coding-trial
          path: |
            codeops-live-trial-evidence.json
            codeops-live-trial.log
            codeops-live-generated.patch
            codeops-live-changed-files.txt
            sergeant-live-provider-review.json
            codeops-staged-evidence/
          if-no-files-found: warn
          retention-days: 30
